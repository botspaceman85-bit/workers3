name: DUTA Worker 3 - Flutter Fast

on:
  workflow_dispatch:
    inputs:
      jobId: {required: true, type: string}
      userId: {required: true, type: string}
      payload: {required: true, type: string}

permissions:
  contents: write
  actions: read

concurrency:
  group: duta-worker3-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Parse payload
        id: cfg
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/out" "$RUNNER_TEMP/work"
          python3 - <<'PY'
          import os,json
          p=json.loads(os.environ["PAYLOAD"])
          if not p.get("url"): raise SystemExit("payload.url tidak ditemukan")
          mode=str(p.get("buildType") or "release").lower()
          if mode not in ("debug","profile","release"): mode="release"
          flutter=str(p.get("flutterVersion") or "").strip()
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("url="+p["url"]+"\n")
              f.write("mode="+mode+"\n")
              f.write("flutter="+flutter+"\n")
          PY

      - name: Download ZIP fast
        env:
          URL: ${{ steps.cfg.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 \
            --max-time 900 --speed-time 20 --speed-limit 1024 \
            -A "DUTA-Worker3/1.0" -o "$RUNNER_TEMP/source.zip" "$URL"
          test -s "$RUNNER_TEMP/source.zip"
          echo "::notice title=BUILD_PROGRESS::10|DOWNLOAD|ZIP selesai"

      - name: Extract safely
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,zipfile
          src=os.path.join(os.environ["RUNNER_TEMP"],"source.zip")
          dst=os.path.join(os.environ["RUNNER_TEMP"],"source")
          root=os.path.realpath(dst)
          with zipfile.ZipFile(src) as z:
              for i in z.infolist():
                  out=os.path.realpath(os.path.join(dst,i.filename))
                  if not (out==root or out.startswith(root+os.sep)):
                      raise SystemExit("Unsafe ZIP path: "+i.filename)
              z.extractall(dst)
          PY

      - name: Locate Flutter project
        id: project
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/source"
          if [ -f "$ROOT/pubspec.yaml" ]; then
            P="$ROOT"
          else
            P="$(find "$ROOT" -maxdepth 7 -type f -name pubspec.yaml -print -quit | xargs -r dirname)"
          fi
          [ -n "${P:-}" ] || { echo "::error::pubspec.yaml tidak ditemukan"; exit 1; }
          echo "path=$P" >> "$GITHUB_OUTPUT"

      - name: Java + Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Flutter SDK cache
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.cfg.outputs.flutter }}
          cache: true

      - name: Pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: duta-worker3-pub-${{ runner.os }}-${{ steps.cfg.outputs.flutter || 'stable' }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            duta-worker3-pub-${{ runner.os }}-${{ steps.cfg.outputs.flutter || 'stable' }}-
            duta-worker3-pub-${{ runner.os }}-

      - name: Dependencies
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          set -euo pipefail
          flutter pub get
          echo "::notice title=BUILD_PROGRESS::42|DEPENDENCIES|Dependencies siap"

      - name: Build attempt 1
        id: build1
        continue-on-error: true
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -o pipefail
          case "${{ steps.cfg.outputs.mode }}" in
            debug) flutter build apk --debug --no-pub 2>&1 | tee "$RUNNER_TEMP/work/build1.log" ;;
            profile) flutter build apk --profile --no-pub 2>&1 | tee "$RUNNER_TEMP/work/build1.log" ;;
            *) flutter build apk --release --no-pub 2>&1 | tee "$RUNNER_TEMP/work/build1.log" ;;
          esac

      - name: Groq safe auto-fix
        id: autofix
        if: steps.build1.outcome == 'failure'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          set -euo pipefail
          [ -n "${GROQ_API_KEY:-}" ] || { echo "::warning::GROQ_API_KEY belum diset; skip auto-fix"; exit 0; }
          python3 - <<'PY'
          import os,json,urllib.request
          log=open(os.path.join(os.environ["RUNNER_TEMP"],"work","build1.log"),errors="ignore").read()[-28000:]
          prompt=("Return ONLY valid JSON {\"patches\":[{\"path\":\"...\",\"find\":\"exact text\",\"replace\":\"replacement\"}]}. "
                  "Allowed paths: pubspec.yaml or android/** only. No shell commands, no Dart source, no secrets. Minimal compatibility fix.\nERROR:\n"+log)
          body=json.dumps({"model":os.environ["GROQ_MODEL"],"temperature":0,
            "messages":[{"role":"system","content":"Valid JSON only."},{"role":"user","content":prompt}]}).encode()
          req=urllib.request.Request("https://api.groq.com/openai/v1/chat/completions",data=body,
            headers={"Authorization":"Bearer "+os.environ["GROQ_API_KEY"],"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=90) as r: data=json.load(r)
          c=data["choices"][0]["message"]["content"].replace("```json","").replace("```","").strip()
          root=os.path.realpath(".")
          for x in json.loads(c).get("patches",[]):
              p=x.get("path","")
              if not (p=="pubspec.yaml" or p.startswith("android/")): raise SystemExit("Blocked patch: "+p)
              full=os.path.realpath(p)
              if not full.startswith(root+os.sep): raise SystemExit("Path traversal blocked")
              old=x.get("find","")
              s=open(full,encoding="utf-8").read()
              if not old or old not in s: raise SystemExit("Patch context not found: "+p)
              open(full,"w",encoding="utf-8").write(s.replace(old,x.get("replace",""),1))
          PY

      - name: Build attempt 2
        id: build2
        if: steps.build1.outcome == 'failure' && steps.autofix.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          set -o pipefail
          flutter pub get
          case "${{ steps.cfg.outputs.mode }}" in
            debug) flutter build apk --debug --no-pub 2>&1 | tee "$RUNNER_TEMP/work/build2.log" ;;
            profile) flutter build apk --profile --no-pub 2>&1 | tee "$RUNNER_TEMP/work/build2.log" ;;
            *) flutter build apk --release --no-pub 2>&1 | tee "$RUNNER_TEMP/work/build2.log" ;;
          esac

      - name: Collect APK
        if: steps.build1.outcome == 'success' || steps.build2.outcome == 'success'
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          set -euo pipefail
          APK="$(find build/app/outputs/apk -type f -name '*.apk' -print -quit || true)"
          [ -n "$APK" ] || { echo "::error::APK tidak ditemukan"; exit 1; }
          cp "$APK" "$RUNNER_TEMP/out/app-${{ inputs.jobId }}.apk"
          sha256sum "$RUNNER_TEMP/out/app-${{ inputs.jobId }}.apk"

      - name: Upload artifact uncompressed
        if: steps.build1.outcome == 'success' || steps.build2.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: ${{ runner.temp }}/out/app-*.apk
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload APK to GitHub Release
        if: steps.build1.outcome == 'success' || steps.build2.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="duta-build-${{ inputs.jobId }}"
          FILE="$RUNNER_TEMP/out/app-${{ inputs.jobId }}.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" \
              --title "DUTA APK ${{ inputs.jobId }}" \
              --notes "Worker 3 automated APK build" --target "$GITHUB_SHA"
          fi

      - name: Fail with log
        if: steps.build1.outcome == 'failure' && steps.build2.outcome != 'success'
        run: |
          echo "::error title=BUILD_FAILED::Build gagal setelah auto-fix"
          tail -n 220 "$RUNNER_TEMP/work/build2.log" 2>/dev/null || tail -n 220 "$RUNNER_TEMP/work/build1.log" || true
          exit 1
