name: DUTA Worker 3 - Android Fast

on:
  workflow_dispatch:
    inputs:
      jobId: {required: true, type: string}
      userId: {required: true, type: string}
      payload: {required: true, type: string}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Parse payload
        id: cfg
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/out"
          python3 - <<'PY'
          import os,json
          p=json.loads(os.environ["PAYLOAD"])
          if not p.get("url"): raise SystemExit("payload.url tidak ditemukan")
          open(os.environ["GITHUB_OUTPUT"],"a").write("url="+p["url"]+"\n")
          PY

      - name: Fast ZIP download
        env:
          URL: ${{ steps.cfg.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 900 \
            -A "DUTA-Worker3/Android" -o "$RUNNER_TEMP/source.zip" "$URL"
          test -s "$RUNNER_TEMP/source.zip"

      - name: Extract + locate Gradle
        id: project
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,zipfile
          d=os.path.join(os.environ["RUNNER_TEMP"],"source"); root=os.path.realpath(d)
          with zipfile.ZipFile(os.path.join(os.environ["RUNNER_TEMP"],"source.zip")) as z:
              for i in z.infolist():
                  o=os.path.realpath(os.path.join(d,i.filename))
                  if not (o==root or o.startswith(root+os.sep)): raise SystemExit("unsafe zip")
              z.extractall(d)
          p=""
          for b,ds,fs in os.walk(d):
              if "gradlew" in fs: p=b; break
          if not p: raise SystemExit("gradlew tidak ditemukan")
          open(os.environ["GITHUB_OUTPUT"],"a").write("path="+p+"\n")
          PY

      - name: Java + Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build APK
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --parallel --build-cache

      - name: Collect
        run: |
          set -euo pipefail
          APK="$(find '${{ steps.project.outputs.path }}' -type f -path '*/build/outputs/apk/*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" "$RUNNER_TEMP/out/app-${{ inputs.jobId }}.apk"

      - name: Upload artifact uncompressed
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: ${{ runner.temp }}/out/app-*.apk
          compression-level: 0
          retention-days: 1

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="duta-build-${{ inputs.jobId }}"
          FILE="$RUNNER_TEMP/out/app-${{ inputs.jobId }}.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" \
              --title "DUTA APK ${{ inputs.jobId }}" \
              --notes "Worker 3 Android build" --target "$GITHUB_SHA"
          fi
